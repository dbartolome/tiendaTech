<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DiegoTech</title>
    <meta name="description" content="Tienda de tecnología DiegoTech" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="navbar" id="top">
      <div class="container nav-inner">
        <a class="brand" href="#/">
          <span class="brand-icon">⚡</span>
          <span>Internacional<span class="text-gradient">Tech</span></span>
        </a>
        <nav class="nav-links" id="navLinks">
          <a href="#inicio">Home</a>
          <a href="#productos">Productos</a>
          <a href="#categorias">Categorías</a>
        </nav>
        <div class="nav-actions">
          <button class="menu-btn" id="menuToggle" type="button" aria-label="Abrir menú" aria-controls="navLinks" aria-expanded="false">☰</button>
          <button class="cart-btn" id="cartToggle" aria-label="Carrito" type="button">🛒 <span class="cart-count">0</span></button>
        </div>
      </div>
    </header>

    <main id="app"></main>
    <div class="cart-overlay" id="cartOverlay" hidden></div>
    <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
      <div class="cart-drawer-head">
        <h2>Tu carrito</h2>
        <button class="icon-btn" id="cartClose" type="button" aria-label="Cerrar carrito">✕</button>
      </div>
      <div id="cartItems" class="cart-items"></div>
      <div class="cart-footer">
        <p>Total: <strong id="cartTotal">€0</strong></p>
        <div class="cart-actions">
          <button class="btn btn-secondary" id="clearCart" type="button">Vaciar</button>
          <button class="btn btn-primary" id="goCheckout" type="button">Comprar</button>
        </div>
      </div>
    </aside>

    <footer class="footer">
      <div class="container footer-inner">
        <a class="brand" href="#/">
          <span class="brand-icon">⚡</span>
          <span>Diego<span class="text-gradient">Tech</span></span>
        </a>
        <p>© 2026 DiegoTech. Todos los derechos reservados.</p>
        <div class="footer-links">
          <a href="#/">Privacidad</a>
          <a href="#/">Términos</a>
          <a href="#/">Contacto</a>
        </div>
      </div>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
